<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="820" viewBox="0 0 1920 820" role="img" aria-labelledby="title desc">
<title id="title">Wort, Strong-Nummer und Grundwort</title><desc id="desc">Verweilte ist in Johannes 3,22 der Elberfelder Ausgabe mit G1304 und dem griechischen Grundwort διατρίβω verknüpft.</desc>
<rect x="0" y="0" width="1920" height="820" fill="#173C33" rx="0"/>
<text x="105" y="123" font-family="Akribos Text, sans-serif" font-size="32" font-weight="600" fill="#C7D9CD" text-anchor="start" letter-spacing="2" font-style="normal">WORTSTUDIE · JOHANNES 3,22</text>
<text x="105" y="249" font-family="Liberation Serif, serif" font-size="75" font-weight="400" fill="#F9F5E9" text-anchor="start" letter-spacing="0" font-style="normal">Ein Wort über seine Nummer finden</text>
<path d="M433 452 L1500 452" fill="none" stroke="#648376" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="105" y="343" width="512" height="205" fill="#264D41" rx="25"/>
<rect x="733" y="343" width="455" height="205" fill="#D5E496" rx="103"/>
<rect x="1305" y="343" width="510" height="205" fill="#264D41" rx="25"/>
<text x="361" y="466" font-family="Liberation Serif, serif" font-size="73" font-weight="400" fill="#F9F5E9" text-anchor="middle" letter-spacing="0" font-style="normal">verweilte</text>
<text x="960" y="476" font-family="Akribos Text, sans-serif" font-size="84" font-weight="600" fill="#163C30" text-anchor="middle" letter-spacing="0" font-style="normal">G1304</text>
<text x="1560" y="468" font-family="Liberation Serif, serif" font-size="76" font-weight="400" fill="#F9F5E9" text-anchor="middle" letter-spacing="0" font-style="normal">διατρίβω</text>
<text x="361" y="625" font-family="Akribos Text, sans-serif" font-size="38" font-weight="400" fill="#C7D9CD" text-anchor="middle" letter-spacing="0" font-style="normal">Deutsches Wort</text>
<text x="960" y="625" font-family="Akribos Text, sans-serif" font-size="38" font-weight="400" fill="#D5E496" text-anchor="middle" letter-spacing="0" font-style="normal">Strong-Nummer</text>
<text x="1560" y="625" font-family="Akribos Text, sans-serif" font-size="38" font-weight="400" fill="#C7D9CD" text-anchor="middle" letter-spacing="0" font-style="normal">Griechisches Grundwort</text>
<text x="960" y="731" font-family="Akribos Text, sans-serif" font-size="40" font-weight="400" fill="#F9F5E9" text-anchor="middle" letter-spacing="0" font-style="normal">H steht für Hebräisch, G für Griechisch.</text>
</svg>
