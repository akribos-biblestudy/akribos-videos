<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="820" viewBox="0 0 1920 820" role="img" aria-labelledby="title desc">
<title id="title">Menge und Schlachter im direkten Vergleich</title><desc id="desc">Die beiden Bibeln setzen die Worte so und so sehr unterschiedlich.</desc>
<rect x="0" y="0" width="1920" height="820" fill="#F0F0E1" rx="0"/>
<text x="103" y="118" font-family="Akribos Text, sans-serif" font-size="32" font-weight="600" fill="#597165" text-anchor="start" letter-spacing="2" font-style="normal">JOHANNES 3,16</text>
<path d="M105 158 L1790 158" fill="none" stroke="#B7C3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="271" font-family="Akribos Text, sans-serif" font-size="45" font-weight="600" fill="#597165" text-anchor="start" letter-spacing="0" font-style="normal">Schlachter 1951</text>
<text x="105" y="380" font-family="Liberation Serif, serif" font-size="84" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">„Denn Gott hat die Welt so geliebt …“</text>
<path d="M103 450 L1790 450" fill="none" stroke="#B7C3A8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="100" y="547" font-family="Akribos Text, sans-serif" font-size="45" font-weight="600" fill="#597165" text-anchor="start" letter-spacing="0" font-style="normal">Menge 1939</text>
<text x="105" y="659" font-family="Liberation Serif, serif" font-size="84" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">„Denn so sehr hat Gott die Welt geliebt …“</text>
<path d="M330 688 L574 688" fill="none" stroke="#AD8A4D" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
