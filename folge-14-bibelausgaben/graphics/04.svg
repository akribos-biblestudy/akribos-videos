<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1920" height="820" viewBox="0 0 1920 820" role="img" aria-labelledby="title desc">
<title id="title">Wortlaut und Wortzuordnung in der Schlachter</title><desc id="desc">Originalausschnitt aus Johannes 3,16. Das Wort geliebt erhält die Verknüpfung G25.</desc>
<rect x="0" y="0" width="1920" height="820" fill="#F6F0E1" rx="0"/>
<rect x="95" y="85" width="15" height="650" fill="#B98A50" rx="0"/>
<text x="158" y="144" font-family="Akribos Text, sans-serif" font-size="32" font-weight="600" fill="#597165" text-anchor="start" letter-spacing="2" font-style="normal">JOHANNES 3,16 · SCHLACHTER 1951</text>
<text x="150" y="330" font-family="Liberation Serif, serif" font-size="106" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">„Denn Gott hat die Welt so</text>
<text x="150" y="465" font-family="Liberation Serif, serif" font-size="128" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">geliebt</text>
<text x="497" y="465" font-family="Liberation Serif, serif" font-size="105" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">, daß er …“</text>
<path d="M157 494 L484 494" fill="none" stroke="#65916B" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M320 500 V572 Q320 591 339 591 H436" fill="none" stroke="#65916B" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="438" y="545" width="205" height="85" fill="#173C33" rx="42"/>
<text x="540" y="603" font-family="Akribos Text, sans-serif" font-size="52" font-weight="600" fill="#F9F5E9" text-anchor="middle" letter-spacing="0" font-style="normal">G25</text>
<text x="725" y="603" font-family="Akribos Text, sans-serif" font-size="49" font-weight="400" fill="#163C30" text-anchor="start" letter-spacing="0" font-style="normal">Verbindung zum griechischen Grundwort</text>
<text x="158" y="715" font-family="Akribos Text, sans-serif" font-size="40" font-weight="400" fill="#597165" text-anchor="start" letter-spacing="0" font-style="normal">Die Zuordnung ergänzt den überlieferten Wortlaut.</text>
</svg>
